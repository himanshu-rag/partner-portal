<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Portal | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="glass-card">
            <div class="brand-header">
                <div class="logo-circle"></div>
                <h1>Partner Portal</h1>
                <p>Access your customer data securely.</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Partner Email</label>
                    <input type="email" id="email" placeholder="name@company.com" required autocomplete="email">
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" id="loginBtn" class="primary-btn">
                    <span>Sign In</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
